{% extends 'catalog/base.html' %}

{% block title %}Контакты — Интернет-магазин{% endblock %}

{% block content %}
<div class="px-3 py-3 pt-md-4 pb-md-4 mx-auto text-center">
    <h1 class="display-5 fw-normal">Контакты</h1>
    <p class="lead text-muted">Наши реквизиты и форма обратной связи</p>
</div>

<div class="row g-4 justify-content-center">
    <div class="col-lg-7 col-md-6">
        <div class="card shadow-sm h-100">
            <div class="card-header bg-white">
                <h4 class="my-0 fw-normal fs-5">Реквизиты компании</h4>
            </div>
            <div class="card-body d-flex align-items-center">
                <table class="table table-striped mb-0">
                    <tbody>
                        <tr>
                            <th scope="row" class="w-25">Страна</th>
                            <td>Russia</td>
                        </tr>
                        <tr>
                            <th scope="row" class="w-25">Телефон</th>
                            <td>987654321</td>
                        </tr>
                        <tr>
                            <th scope="row" class="w-25">Адрес</th>
                            <td>Moskow, Lenina street, 1</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="col-lg-5 col-md-6">
        <div class="card shadow-sm h-100">
            <div class="card-header bg-white">
                <h4 class="my-0 fw-normal fs-5">Свяжитесь с нами</h4>
            </div>
            <div class="card-body">
                <form method="post" action="">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="name" class="form-label">Имя</label>
                        <input type="text" name="name" class="form-control" id="name" placeholder="Ваше имя" required>
                    </div>
                    <div class="mb-3">
                        <label for="phone" class="form-label">Телефон</label>
                        <input type="tel" name="phone" class="form-control" id="phone" placeholder="Контактный телефон" required>
                    </div>
                    <div class="mb-3">
                        <label for="message" class="form-label">Сообщение</label>
                        <textarea name="message" class="form-control" id="message" rows="3" placeholder="Ваше сообщение" required></textarea>
                    </div>
                    <button type="submit" class="btn btn-lg btn-outline-primary w-100">Отправить</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
