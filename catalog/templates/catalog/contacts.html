<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Контакты — Интернет-магазин</title>
    <link href="https://jsdelivr.net" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="/">Магазин</a>
        <div class="navbar-nav">
            <a class="nav-link" href="/">Главная</a>
            <a class="nav-link active" href="/contacts/">Контакты</a>
        </div>
    </div>
</nav>

<div class="container">
    <h1 class="mb-4">Контакты</h1>
    <div class="row">
        <div class="col-md-6">
            <div class="card mb-4">
                <div class="card-body">
                    <h5 class="card-title">Наши данные</h5>
                    <p class="card-text"><strong>Адрес:</strong> г. Москва, ул. Примерная, д. 1</p>
                    <p class="card-text"><strong>Телефон:</strong> +7 (999) 123-45-67</p>
                    <p class="card-text"><strong>Email:</strong> info@shop-example.ru</p>
                </div>
            </div>
        </div>
        <div class="col-md-6">
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label for="name" class="form-label">Имя</label>
                    <input type="text" class="form-control" id="name" name="name" required>
                </div>
                <div class="mb-3">
                    <label for="phone" class="form-label">Телефон</label>
                    <input type="text" class="form-control" id="phone" name="phone" required>
                </div>
                <div class="mb-3">
                    <label for="message" class="form-label">Сообщение</label>
                    <textarea class="form-control" id="message" name="message" rows="3" required></textarea>
                </div>
                <button type="submit" class="btn btn-primary">Отправить</button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
